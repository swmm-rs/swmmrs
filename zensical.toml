docs_dir = "docs"
site_name = "swmmrs"
site_description = "Parity-first Rust port of the EPA SWMM solver"
repo_url = "https://github.com/swmm-rs/swmmrs"
repo_name = "swmm-rs/swmmrs"
edit_uri = "edit/main/docs/"
watch = ["README.md", "tools/swmm_pygments/src/swmm_pygments/lexer.py", "tools/typescript-docs/.generated"]
extra_css = [
    "stylesheets/solarized.css",
    "stylesheets/home.css",
    "stylesheets/toc-collapse.css",
    "stylesheets/mermaid-zoom.css",
]
extra_javascript = [
    "javascripts/toc-collapse.js",
    "javascripts/mermaid-zoom.js",
    "javascripts/mathjax.js",
    "https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js",
]

[project.extra]
generator = false

[project.extra.version]
default = "stable"

[project.theme]
logo = "_static/img/logo.png"
favicon = "_static/img/logo.png"
features = [
    "content.code.copy",
    "content.code.annotate",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.path",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "search.share",
    "search.suggest",
    "toc.follow",
]


[project.theme.icon]
repo = "fontawesome/brands/github-alt"


[[project.theme.palette]]
media = "(prefers-color-scheme)"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

# Palette toggle for light mode
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

# Palette toggle for dark mode
[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.swmm_pygments]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.snippets]
check_paths = true
[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.admonition]
[project.markdown_extensions.pymdownx.emoji]
emoji_generator = "zensical.extensions.emoji.to_svg"
emoji_index = "zensical.extensions.emoji.twemoji"
# [project.markdown_extensions]
# "pymdownx.snippets" = { check_paths = true }

[project.markdown_extensions.abbr]

[project.markdown_extensions.toc]
toc_depth = 5

[project.plugins.mkdocstrings.handlers.python]
paths = ["python/src"]
inventories = ["https://docs.python.org/3/objects.inv"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"
docstring_section_style = "spacy"

relative_crossrefs = true
scoped_crossrefs = true
signature_crossrefs = true
unwrap_annotated = true

filters = "public"
inherited_members = true
summary = true
# show_labels = true

heading_level = 3
parameter_headings = true
type_parameter_headings = true
show_root_heading = false
show_root_toc_entry = false
show_root_full_path = false
show_symbol_type_heading = true
show_symbol_type_toc = true

line_length = 88
merge_init_into_class = false
separate_signature = true
show_signature_annotations = true
show_signature_type_parameters = true

backlinks = "tree"
show_bases = false
show_inheritance_diagram = true

show_source = false

[project.plugins.mkdocstrings.handlers.python.options.docstring_options]
ignore_init_summary = true
