[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "swmm_pygments"
version = "0.1.0"
description = "Pygments highlighting for SWMM input files"
requires-python = ">=3.10"
dependencies = [
    "pygments>=2.20.0",
    "pymdown-extensions>=11.0.1",
]

[project.entry-points."pygments.lexers"]
swmm = "swmm_pygments:SwmmLexer"

[tool.setuptools.packages.find]
where = ["src"]
