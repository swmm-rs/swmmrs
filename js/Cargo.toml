[workspace]
resolver = "2"

[package]
name = "swmmrs-js"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
swmmrs = { path = "../crates/solver" }
swmm-output = { path = "../crates/output" }
swmmrs-parallel = { path = "../crates/solver/thirdparty/swmmrs-parallel" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"

[profile.release]
panic = "abort"
# Do not ship internal Rust symbol names in the public WASM runtime.
strip = "symbols"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
