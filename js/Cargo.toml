[workspace]
resolver = "2"

[package]
name = "swmmrs-js"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
swmmrs = { path = "../crates/solver" }
swmm-output = { path = "../crates/output" }
swmmrs-parallel = { path = "../crates/solver/thirdparty/swmmrs-parallel" }
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = "symbols"
incremental = false

[package.metadata.wasm-pack.profile.release]
wasm-opt = [
    "-O3",
    "--enable-bulk-memory",
    "--enable-threads",
    "--enable-simd",
    "--enable-nontrapping-float-to-int",
]  