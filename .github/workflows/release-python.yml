name: Release Python

on:
    workflow_dispatch:
        inputs:
            sha:
                description: Exact 40-character commit SHA to release
                required: true
                type: string
            dry_run:
                description: Build wheels without creating a tag or publishing
                required: true
                default: false
                type: boolean
            resume:
                description: Resume the matching draft after a partial PyPI publication
                required: true
                default: false
                type: boolean

permissions:
    contents: read

concurrency:
    group: release-python
    cancel-in-progress: false

jobs:
    plan:
        name: Validate Python release
        runs-on: ubuntu-24.04
        outputs:
            release_id: ${{ steps.plan.outputs.release_id }}
            source_sha: ${{ steps.plan.outputs.source_sha }}
            tag: ${{ steps.plan.outputs.tag }}
            version: ${{ steps.plan.outputs.version }}
        steps:
            - name: Check out selected commit
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ inputs.sha }}
                  persist-credentials: false

            - name: Derive version and reject release conflicts
              id: plan
              shell: bash
              env:
                  API_URL: ${{ github.api_url }}
                  DRY_RUN: ${{ inputs.dry_run }}
                  GITHUB_TOKEN: ${{ github.token }}
                  INPUT_SHA: ${{ inputs.sha }}
                  REPOSITORY: ${{ github.repository }}
                  RESUME: ${{ inputs.resume }}
              run: |
                  set -euo pipefail
                  SOURCE_SHA=$(git rev-parse HEAD)
                  export SOURCE_SHA
                  python - <<'PY'
                  import json
                  import os
                  import pathlib
                  import re
                  import tomllib
                  import urllib.error
                  import urllib.request

                  requested_sha = os.environ["INPUT_SHA"]
                  if re.fullmatch(r"[0-9a-fA-F]{40}", requested_sha) is None:
                      raise SystemExit("sha must be an exact 40-character commit SHA")

                  source_sha = os.environ["SOURCE_SHA"]
                  if source_sha.lower() != requested_sha.lower():
                      raise SystemExit(f"requested {requested_sha}, checked out {source_sha}")

                  def project_version(path: str) -> str:
                      with pathlib.Path(path).open("rb") as file:
                          return tomllib.load(file)["project"]["version"]

                  def package_version(path: str) -> str:
                      with pathlib.Path(path).open("rb") as file:
                          return tomllib.load(file)["package"]["version"]

                  versions = {
                      "Python distribution": project_version("python/pyproject.toml"),
                      "Python extension crate": package_version("python/Cargo.toml"),
                  }
                  version = versions["Python distribution"]
                  if re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)", version) is None:
                      raise SystemExit(f"Python release version must be stable SemVer; found {version}")
                  mismatches = {name: found for name, found in versions.items() if found != version}
                  if mismatches:
                      details = ", ".join(f"{name}={found}" for name, found in mismatches.items())
                      raise SystemExit(f"Python versions do not agree: {details}")

                  tag = f"py-{version}"

                  def get_json(url: str, token: str | None = None) -> dict | None:
                      headers = {"Accept": "application/vnd.github+json", "User-Agent": "swmmrs-release"}
                      if token is not None:
                          headers["Authorization"] = f"Bearer {token}"
                          headers["X-GitHub-Api-Version"] = "2022-11-28"
                      request = urllib.request.Request(url, headers=headers)
                      try:
                          with urllib.request.urlopen(request) as response:
                              return json.load(response)
                      except urllib.error.HTTPError as error:
                          if error.code == 404:
                              return None
                          raise

                  def resolve_target(api: str, repository: str, token: str, target: dict) -> dict:
                      for _ in range(4):
                          if target["type"] == "commit":
                              return target
                          if target["type"] != "tag":
                              raise SystemExit(f"release tag points to unsupported {target['type']}")
                          tag_object = get_json(
                              f"{api}/repos/{repository}/git/tags/{target['sha']}", token
                          )
                          if tag_object is None:
                              raise SystemExit("release tag object disappeared")
                          target = tag_object["object"]
                      return target

                  if os.environ["DRY_RUN"] == "true" and os.environ["RESUME"] == "true":
                      raise SystemExit("dry_run and resume cannot both be enabled")

                  release_id = ""
                  if os.environ["DRY_RUN"] != "true":
                      api = os.environ["API_URL"]
                      repository = os.environ["REPOSITORY"]
                      token = os.environ["GITHUB_TOKEN"]
                      tag_ref = get_json(f"{api}/repos/{repository}/git/ref/tags/{tag}", token)
                      release = get_json(f"{api}/repos/{repository}/releases/tags/{tag}", token)
                      pypi = get_json(f"https://pypi.org/pypi/swmmrs/{version}/json")

                      if os.environ["RESUME"] == "true":
                          if tag_ref is None or release is None:
                              raise SystemExit("resume requires an existing matching draft release and tag")
                          target = resolve_target(api, repository, token, tag_ref["object"])
                          if target["type"] != "commit" or target["sha"] != source_sha:
                              raise SystemExit(
                                  f"resume tag mismatch: expected {source_sha}, found {target}"
                              )
                          if not release["draft"]:
                              raise SystemExit("resume requires an unpublished draft release")
                          release_id = str(release["id"])
                      else:
                          conflicts = []
                          if tag_ref is not None:
                              conflicts.append(f"tag {tag}")
                          if release is not None:
                              conflicts.append(f"release {tag}")
                          if pypi is not None:
                              conflicts.append(f"PyPI swmmrs {version}")
                          if conflicts:
                              raise SystemExit("release conflicts already exist: " + ", ".join(conflicts))

                  output = pathlib.Path(os.environ["GITHUB_OUTPUT"])
                  with output.open("a", encoding="utf-8") as file:
                      file.write(f"release_id={release_id}\n")
                      file.write(f"source_sha={source_sha}\n")
                      file.write(f"tag={tag}\n")
                      file.write(f"version={version}\n")
                  print(json.dumps({"source_sha": source_sha, "tag": tag, "version": version}))
                  PY

    build-wheel:
        name: Wheel (${{ matrix.runner }})
        needs: plan
        environment:
            name: maintainer-approved
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                runner:
                    - ubuntu-24.04
                    - ubuntu-24.04-arm
                    - macos-15-intel
                    - macos-15
                    - windows-2022
                    - windows-11-arm
        runs-on: ${{ matrix.runner }}
        steps:
            - name: Generate GitHub App token
              id: app-token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
              with:
                  client-id: ${{ secrets.APP_CLIENT_ID }}
                  private-key: ${{ secrets.APP_PRIVATE_KEY }}
                  owner: ${{ github.repository_owner }}
                  repositories: |
                      swmmrs
                      swmmrs-solver
                      swmmrs-parallel
                  permission-contents: read

            - name: Check out source and private dependencies
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ needs.plan.outputs.source_sha }}
                  token: ${{ steps.app-token.outputs.token }}
                  submodules: recursive
                  persist-credentials: false

            - name: Install pinned Rust toolchain
              uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
              with:
                  toolchain: "1.98.1"

            - name: Install pinned uv
              uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
              if: matrix.runner == 'ubuntu-24.04'
              with:
                  version: "0.12.11"

            - name: Build and test wheel
              uses: pypa/cibuildwheel@1828c10ab37f080699c7b81cea34097c684a7074 # v4.2.0
              with:
                  package-dir: python
                  output-dir: wheelhouse
                  config-file: "{package}/pyproject.toml"

            - name: Run GIL-disabled suites and owner contention tests
              if: matrix.runner == 'ubuntu-24.04'
              run: uv run --no-project python python/tests/run_free_threaded.py

            - name: Upload wheel
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: wheel-${{ matrix.runner }}
                  path: wheelhouse/*.whl
                  if-no-files-found: error
                  retention-days: 7
                  overwrite: true

    validate-wheels:
        name: Validate Python wheel set
        needs:
            - plan
            - build-wheel
        runs-on: ubuntu-24.04
        steps:
            - name: Download wheels
              uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
              with:
                  pattern: wheel-*
                  path: dist
                  merge-multiple: true

            - name: Validate complete wheel set
              shell: bash
              env:
                  VERSION: ${{ needs.plan.outputs.version }}
              run: |
                  set -euo pipefail
                  python - <<'PY'
                  import os
                  import pathlib
                  import re

                  version = re.escape(os.environ["VERSION"])
                  platforms = [
                      r"manylinux_2_28_x86_64",
                      r"manylinux_2_28_aarch64",
                      r"macosx_[0-9]+_[0-9]+_x86_64",
                      r"macosx_[0-9]+_[0-9]+_arm64",
                      r"win_amd64",
                      r"win_arm64",
                  ]
                  patterns = [
                      rf"swmmrs-{version}-{abi}-{platform}\.whl"
                      for abi in (
                                    "cp311-abi3", 
                                    "cp314-cp314t", 
                                    # r"cp315-abi3\.abi3t"
                                )
                      for platform in platforms
                  ]
                  names = sorted(path.name for path in pathlib.Path("dist").iterdir() if path.is_file())
                  unmatched = [name for name in names if not any(re.fullmatch(pattern, name) for pattern in patterns)]
                  missing = [pattern for pattern in patterns if not any(re.fullmatch(pattern, name) for name in names)]
                  if len(names) != len(patterns) or unmatched or missing:
                      raise SystemExit(
                          f"Wheel set mismatch; count={len(names)}, unmatched={unmatched}, missing={missing}"
                      )
                  for name in names:
                      print(name)
                  PY

            - name: Upload validated wheel set
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                  name: python-release-wheels
                  path: dist/*.whl
                  if-no-files-found: error
                  retention-days: 7
                  overwrite: true

    prepare-github-release:
        name: Prepare Python GitHub release
        needs:
            - plan
            - validate-wheels
        if: inputs.dry_run == false
        runs-on: ubuntu-24.04
        environment:
            name: github-release
            url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.plan.outputs.tag }}
        permissions:
            contents: write
        outputs:
            release_id: ${{ steps.release.outputs.release_id }}
        steps:
            - name: Create or adopt draft release and tag
              id: release
              shell: bash
              env:
                  API_URL: ${{ github.api_url }}
                  EXISTING_RELEASE_ID: ${{ needs.plan.outputs.release_id }}
                  GITHUB_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  RESUME: ${{ inputs.resume }}
                  SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
                  TAG: ${{ needs.plan.outputs.tag }}
                  VERSION: ${{ needs.plan.outputs.version }}
              run: |
                  set -euo pipefail
                  python - <<'PY'
                  import json
                  import os
                  import pathlib
                  import urllib.request

                  if os.environ["RESUME"] == "true":
                      release_id = os.environ["EXISTING_RELEASE_ID"]
                      if not release_id:
                          raise SystemExit("resume did not provide an existing release ID")
                      print(f"Adopting draft release {os.environ['TAG']}")
                  else:
                      payload = json.dumps({
                          "tag_name": os.environ["TAG"],
                          "target_commitish": os.environ["SOURCE_SHA"],
                          "name": f"Python swmmrs {os.environ['VERSION']}",
                          "draft": True,
                          "prerelease": False,
                          "generate_release_notes": True,
                          "make_latest": "false",
                      }).encode()
                      request = urllib.request.Request(
                          f"{os.environ['API_URL']}/repos/{os.environ['REPOSITORY']}/releases",
                          data=payload,
                          method="POST",
                          headers={
                              "Accept": "application/vnd.github+json",
                              "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                              "Content-Type": "application/json",
                              "User-Agent": "swmmrs-release",
                              "X-GitHub-Api-Version": "2022-11-28",
                          },
                      )
                      with urllib.request.urlopen(request) as response:
                          release_id = str(json.load(response)["id"])
                      print(f"Created draft release {os.environ['TAG']} at {os.environ['SOURCE_SHA']}")

                  output = pathlib.Path(os.environ["GITHUB_OUTPUT"])
                  with output.open("a", encoding="utf-8") as file:
                      file.write(f"release_id={release_id}\n")
                  PY

    publish-pypi:
        name: Publish wheels to PyPI
        needs:
            - plan
            - validate-wheels
            - prepare-github-release
        if: inputs.dry_run == false
        runs-on: ubuntu-24.04
        environment:
            name: pypi
            url: https://pypi.org/p/swmmrs
        permissions:
            contents: read
            id-token: write
        steps:
            - name: Download validated wheels
              uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
              with:
                  name: python-release-wheels
                  path: dist

            - name: Verify existing PyPI files and retain missing wheels
              id: pypi-state
              shell: bash
              env:
                  VERSION: ${{ needs.plan.outputs.version }}
              run: |
                  set -euo pipefail
                  python - <<'PY'
                  import hashlib
                  import json
                  import os
                  import pathlib
                  import urllib.error
                  import urllib.request

                  wheels = {path.name: path for path in pathlib.Path("dist").glob("*.whl")}
                  request = urllib.request.Request(
                      f"https://pypi.org/pypi/swmmrs/{os.environ['VERSION']}/json",
                      headers={"User-Agent": "swmmrs-release"},
                  )
                  try:
                      with urllib.request.urlopen(request) as response:
                          metadata = json.load(response)
                  except urllib.error.HTTPError as error:
                      if error.code != 404:
                          raise
                      metadata = {"urls": []}

                  for published in metadata["urls"]:
                      filename = published["filename"]
                      if filename not in wheels:
                          raise SystemExit(f"PyPI contains unexpected file for this version: {filename}")
                      local_hash = hashlib.sha256(wheels[filename].read_bytes()).hexdigest()
                      published_hash = published["digests"]["sha256"]
                      if local_hash != published_hash:
                          raise SystemExit(
                              f"PyPI hash mismatch for {filename}: local={local_hash}, published={published_hash}"
                          )
                      wheels[filename].unlink()
                      print(f"Already published with matching hash: {filename}")

                  missing = any(pathlib.Path("dist").glob("*.whl"))
                  with pathlib.Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as file:
                      file.write(f"missing={'true' if missing else 'false'}\n")
                  PY

            - name: Publish missing wheels with PyPI Trusted Publishing
              if: steps.pypi-state.outputs.missing == 'true'
              uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
              with:
                  packages-dir: dist/
                  skip-existing: true

    publish-github-release:
        name: Publish Python GitHub release
        needs:
            - plan
            - prepare-github-release
            - publish-pypi
        if: inputs.dry_run == false
        runs-on: ubuntu-24.04
        environment:
            name: github-release
            url: https://github.com/${{ github.repository }}/releases/tag/${{ needs.plan.outputs.tag }}
        permissions:
            contents: write
        steps:
            - name: Publish draft release
              shell: bash
              env:
                  API_URL: ${{ github.api_url }}
                  GITHUB_TOKEN: ${{ github.token }}
                  RELEASE_ID: ${{ needs.prepare-github-release.outputs.release_id }}
                  REPOSITORY: ${{ github.repository }}
                  SOURCE_SHA: ${{ needs.plan.outputs.source_sha }}
                  TAG: ${{ needs.plan.outputs.tag }}
              run: |
                  set -euo pipefail
                  python - <<'PY'
                  import json
                  import os
                  import urllib.request

                  headers = {
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                      "Content-Type": "application/json",
                      "User-Agent": "swmmrs-release",
                      "X-GitHub-Api-Version": "2022-11-28",
                  }
                  base = f"{os.environ['API_URL']}/repos/{os.environ['REPOSITORY']}"
                  request = urllib.request.Request(
                      f"{base}/git/ref/tags/{os.environ['TAG']}", headers=headers
                  )
                  with urllib.request.urlopen(request) as response:
                      target = json.load(response)["object"]
                  for _ in range(4):
                      if target["type"] == "commit":
                          break
                      if target["type"] != "tag":
                          raise SystemExit(f"release tag points to unsupported {target['type']}")
                      request = urllib.request.Request(f"{base}/git/tags/{target['sha']}", headers=headers)
                      with urllib.request.urlopen(request) as response:
                          target = json.load(response)["object"]
                  if target["type"] != "commit" or target["sha"] != os.environ["SOURCE_SHA"]:
                      raise SystemExit(
                          f"release tag moved: expected {os.environ['SOURCE_SHA']}, found {target}"
                      )

                  request = urllib.request.Request(
                      f"{base}/releases/{os.environ['RELEASE_ID']}",
                      data=json.dumps({"draft": False, "make_latest": "false"}).encode(),
                      method="PATCH",
                      headers=headers,
                  )
                  with urllib.request.urlopen(request) as response:
                      release = json.load(response)
                  print(release["html_url"])
                  PY
