name: Main CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-rust:
    name: Test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
          - platform: macos-arm64
            runner: macos-15
          - platform: windows-x64
            runner: windows-2022
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: swmm-rs
      - name: Check out workspace and private dependencies
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          submodules: recursive
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1.16.1
        with:
          toolchain: "1.97.1"
      - name: Run locked all-features workspace test suite
        run: cargo test --workspace --exclude swmmrs-parallel --locked --all-features

  test-python:
    name: Python tests (linux-x64)
    runs-on: ubuntu-24.04
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: swmm-rs
      - name: Check out workspace and private dependencies
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          submodules: recursive
          persist-credentials: false
      - name: Install pinned Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: "1.97.1"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.11"
      - name: Install Python test dependencies
        working-directory: python
        run: uv sync --locked
      - name: Run Python unit tests
        working-directory: python
        run: uv run pytest

  test-js:
    name: JavaScript tests (linux-x64)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: js
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: swmm-rs
      - name: Check out workspace and private dependencies
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          submodules: recursive
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: js/package-lock.json
      - name: Install Rust toolchain from js/rust-toolchain.toml
        run: rustup show active-toolchain
      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run JavaScript unit tests
        run: npm test
